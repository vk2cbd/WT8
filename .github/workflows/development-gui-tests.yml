name: WT8 development GUI checks
on:
  push:
    branches: [feature/manual-latched-gui-redesign]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q wt8_ubuntu_gui.py wt8_antenna.py
      - run: python -m unittest discover -s tests -v
